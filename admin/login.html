<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị | TEX-GIANG</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tw.config.js"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-surface p-4 font-sans text-body antialiased">

  <main class="w-full max-w-[420px] rounded-media bg-white p-8 sm:p-10">
    <div class="text-center">
      <img src="../assets/images/logo-tgi.png" alt="Logo TEX-GIANG" class="mx-auto h-12 w-auto object-contain">
      <h1 class="mt-4 text-[22px] font-medium leading-tight text-ink">Cổng quản trị tuyển dụng</h1>
      <p class="mt-1 text-[14px] text-muted">Công ty Cổ phần TEX-GIANG</p>
    </div>

    <p class="mt-6 rounded-card bg-accent-soft px-4 py-3 text-[14px] leading-[1.6] text-muted">
      <strong class="font-medium text-accent">Chế độ demo:</strong> bấm “Đăng nhập” để vào giao diện quản trị, không cần mật khẩu thật.
    </p>

    <form id="admin-login-form" onsubmit="handleLogin(event)" class="mt-6 space-y-4">
      <div>
        <label class="form-label" for="login-username">Tên đăng nhập hoặc email <span class="req">*</span></label>
        <input type="text" id="login-username" value="admin@texgiang.demo.vn" required autocomplete="username"
               class="form-input">
      </div>

      <div>
        <label class="form-label" for="login-password">Mật khẩu <span class="req">*</span></label>
        <div class="relative">
          <input type="password" id="login-password" value="demo12345678" required autocomplete="current-password"
                 class="form-input pr-11">
          <button type="button" onclick="togglePasswordVisibility()" aria-label="Hiện hoặc ẩn mật khẩu"
                  class="absolute inset-y-0 right-0 grid w-10 place-items-center text-muted transition-colors hover:text-ink">
            <i id="password-toggle-icon" class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 text-[14px] text-muted">
        <label class="flex cursor-pointer items-center gap-2">
          <input type="checkbox" checked class="h-4 w-4 rounded border-line text-accent focus:ring-accent">
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="#" onclick="showToast('Liên hệ IT-P.KT-NS để cấp lại mật khẩu.', 'error'); return false;"
           class="font-medium text-accent hover:underline">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="tg-btn tg-btn--primary w-full">
        Đăng nhập hệ thống <i class="bi bi-arrow-right text-[14px]"></i>
      </button>
    </form>

    <p class="mt-6 text-center">
      <a href="../index.html" class="tg-link text-[14px]"><i class="bi bi-arrow-left text-[13px]"></i> Về website tuyển dụng</a>
    </p>
  </main>

  <div id="toast-container"></div>

  <script src="../assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('password-toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      showToast('Đăng nhập thành công. Đang vào bảng điều khiển…', 'success');
      setTimeout(function () {
        window.location.href = 'dashboard.html';
      }, 900);
    }
  </script>
</body>
</html>
