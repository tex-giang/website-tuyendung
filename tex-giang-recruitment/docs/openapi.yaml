openapi: 3.0.3
info:
  title: TEX-GIANG Recruitment Admin API
  version: 1.0.0
servers:
  - url: /
paths:
  /admin/api/applications/new:
    get:
      operationId: listNewApplications
      summary: Danh sách và tổng số hồ sơ đang ở trạng thái Mới nhận
      description: Áp dụng quyền xem hồ sơ và phạm vi nhà máy của tài khoản quản trị hoặc tài khoản gán cho token tích hợp. Sắp xếp theo thời gian nộp giảm dần, sau đó theo mã hồ sơ giảm dần.
      security:
        - ApplicationsToken: []
        - AdminSession: []
      parameters:
        - name: page
          in: query
          description: Trang vượt phạm vi trả về trang cuối.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Hồ sơ mới phân trang
          content:
            application/json:
              schema:
                type: object
                required: [ok, items, total, page, per_page, pages]
                properties:
                  ok: { type: boolean, enum: [true] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, job_id, job_title, status, created_at]
                      properties:
                        id: { type: integer, format: int64 }
                        job_id: { type: integer, format: int64, nullable: true }
                        job_title: { type: string, nullable: true }
                        status: { type: string, enum: [new] }
                        created_at: { type: string, example: '2026-11-27 09:30:00' }
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  per_page: { type: integer, minimum: 1, maximum: 100 }
                  pages: { type: integer, minimum: 1 }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApplicationsToken:
      type: http
      scheme: bearer
      description: Token tích hợp riêng cho endpoint hồ sơ mới. Dùng qua HTTPS.
    AdminSession:
      type: apiKey
      in: cookie
      name: texgiang_admin
  responses:
    Error:
      description: Yêu cầu bị từ chối hoặc máy chủ gặp lỗi.
      content:
        application/json:
          schema:
            type: object
            required: [ok, code, message]
            properties:
              ok: { type: boolean, enum: [false] }
              code: { type: string, enum: [invalid_pagination, auth_required, invalid_token, forbidden, server_error] }
              message: { type: string }
              redirect: { type: string, description: Đường dẫn đăng nhập nếu phiên đã hết hạn. }
