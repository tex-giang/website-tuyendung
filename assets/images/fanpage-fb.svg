  <text x="142" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#b7dcc8">TEX-GIANG</text>

  <text x="40" y="318" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Theo dõi tin tuyển dụng</text>
